# =====================================================================
#  Pac-Man contribution graph generator
#  PATH IN YOUR REPO:  .github/workflows/pacman.yml
#
#  Pac-Man eats your real contribution squares while ghosts chase him.
#  Runs daily, on push, and whenever you trigger it from the Actions tab.
#
#  IMPORTANT: delete your old snake.yml first. Both write to the same
#  "output" branch, so keeping both makes them overwrite each other.
#
#  Want a different arcade game instead? Change the games: line to one of
#  pacman | breakout | galaga | puzzle-bobble | bomberman | minesweeper
#  (and update the filenames in your README to match the game name).
# =====================================================================
name: Generate Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
