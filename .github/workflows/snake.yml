# =====================================================================
#  Contribution Snake generator
#  PATH IN YOUR REPO:  .github/workflows/snake.yml
#  (create the .github/workflows/ folders if they don't exist)
#
#  What it does: reads your real contribution graph and draws a snake
#  that eats the squares. Runs once a day, on every push to main, and
#  whenever you trigger it by hand from the Actions tab.
# =====================================================================
name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"   # once a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39d353

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
