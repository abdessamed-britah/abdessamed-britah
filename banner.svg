<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="Abdessamed Britah banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.5" stop-color="#0c2417"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="0.45" stop-color="#e01f1f"/>
      <stop offset="1" stop-color="#7a0d0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    @keyframes glow { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes rise { 0%{opacity:0} 15%{opacity:.9} 100%{opacity:0; transform:translateY(-55px)} }
    @keyframes fin  { 0%{opacity:0} 100%{opacity:1} }
    .eye  { animation: glow 2.6s ease-in-out infinite; }
    .e2   { animation-delay:1.3s; }
    .ember{ animation: rise 4.5s linear infinite; }
    .m2{animation-delay:1.1s}.m3{animation-delay:2.2s}.m4{animation-delay:3.3s}
    .name { font-family:'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; font-weight:800; animation: fin 1.1s ease-out both; }
    .sub  { font-family:'Segoe UI',system-ui,Arial,sans-serif; font-weight:600; animation: fin 1.6s ease-out both; }
  </style>

  <rect width="900" height="220" fill="url(#bg)"/>
  <path d="M0,198 Q450,236 900,198 L900,220 L0,220 Z" fill="#05070a" opacity="0.55"/>

  <!-- original hooded silhouette (generic shadow figure) -->
  <g transform="translate(680,22)">
    <path d="M42,182 C42,108 62,66 104,50 C146,66 166,108 166,182 Z" fill="#03050a"/>
    <path d="M104,16 C56,16 44,70 62,102 C80,80 128,80 146,102 C164,70 152,16 104,16 Z" fill="#03050a"/>
    <ellipse cx="104" cy="86" rx="36" ry="32" fill="#010206"/>
    <g class="eye">
      <circle cx="91" cy="88" r="9" fill="url(#eye)" filter="url(#blur)"/>
      <circle cx="91" cy="88" r="3" fill="#ffe2e2"/>
    </g>
    <g class="eye e2">
      <circle cx="118" cy="88" r="9" fill="url(#eye)" filter="url(#blur)"/>
      <circle cx="118" cy="88" r="3" fill="#ffe2e2"/>
    </g>
  </g>

  <!-- drifting red embers -->
  <g fill="#e23b3b">
    <circle class="ember"    cx="712" cy="186" r="2"/>
    <circle class="ember m2" cx="766" cy="192" r="1.6"/>
    <circle class="ember m3" cx="818" cy="188" r="2.2"/>
    <circle class="ember m4" cx="676" cy="196" r="1.4"/>
  </g>

  <!-- name baked in -->
  <text class="name" x="58" y="112" font-size="52" fill="#ffffff">Abdessamed Britah</text>
  <text class="sub"  x="60" y="146" font-size="19" fill="#39d353">AI &amp; ML Engineer &#183; AI Security &amp; LLM Safety</text>
</svg>
