<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Abdessamed Britah banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#05070a"/><stop offset="0.6" stop-color="#071410"/><stop offset="1" stop-color="#0a2417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.14"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uline" x1="0" x2="1"><stop offset="0" stop-color="#39d353" stop-opacity="0"/><stop offset="0.5" stop-color="#39d353" stop-opacity="0.8"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#39d353" stop-opacity="0"/><stop offset="0.5" stop-color="#39d353" stop-opacity="0.10"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
    <filter id="ng" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <mask id="nameMask"><text x="70" y="116" font-size="52" font-family="'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#fff">Abdessamed Britah</text></mask>
  </defs>
  <style>
    @keyframes np { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes tw { 0%,100%{stroke-opacity:.12} 50%{stroke-opacity:.38} }
    @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes gp { 0%,100%{opacity:.12} 50%{opacity:.42} }
    @keyframes fin { from{opacity:0} to{opacity:1} }
    .nd { animation: np 2.8s ease-in-out infinite; }
    .edge { animation: tw 4s ease-in-out infinite; }
    .cur { animation: cur 1.1s steps(1) infinite; }
    .glow { animation: gp 2.6s ease-in-out infinite; }
    .name { font-family:'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; font-weight:800; animation: fin 1s ease-out both; }
    .sub  { font-family:'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif; font-weight:600; animation: fin 1.5s ease-out both; }
    .kick { font-family:'SF Mono','Consolas',ui-monospace,monospace; font-weight:600; letter-spacing:2px; }
  </style>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#glow)"/>

  <!-- graph -->
  <g filter="url(#soft)">
  <line class="edge" x1="400" y1="64" x2="468" y2="124" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.97s"/>
  <line class="edge" x1="834" y1="60" x2="872" y2="112" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.45s"/>
  <line class="edge" x1="468" y1="124" x2="524" y2="44" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.95s"/>
  <line class="edge" x1="590" y1="92" x2="560" y2="162" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.22s"/>
  <line class="edge" x1="686" y1="132" x2="636" y2="176" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.61s"/>
  <line class="edge" x1="834" y1="60" x2="760" y2="36" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.1s"/>
  <line class="edge" x1="800" y1="152" x2="872" y2="112" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.17s"/>
  <line class="edge" x1="524" y1="44" x2="590" y2="92" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.52s"/>
  <line class="edge" x1="686" y1="132" x2="742" y2="82" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.11s"/>
  <line class="edge" x1="400" y1="64" x2="524" y2="44" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.3s"/>
  <line class="edge" x1="742" y1="82" x2="760" y2="36" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.21s"/>
  <line class="edge" x1="648" y1="52" x2="686" y2="132" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.27s"/>
  <line class="edge" x1="742" y1="82" x2="800" y2="152" stroke="#39d353" stroke-width="0.7" style="animation-delay:1.27s"/>
  <line class="edge" x1="560" y1="162" x2="636" y2="176" stroke="#39d353" stroke-width="0.7" style="animation-delay:2.48s"/>
  <line class="edge" x1="590" y1="92" x2="648" y2="52" stroke="#39d353" stroke-width="0.7" style="animation-delay:0.37s"/>
  </g>
  <circle class="nd" cx="400" cy="64" r="3" fill="#39d353" style="animation-delay:0.67s"/>
  <circle class="nd" cx="468" cy="124" r="3" fill="#39d353" style="animation-delay:1.88s"/>
  <circle class="nd" cx="524" cy="44" r="3" fill="#39d353" style="animation-delay:2.84s"/>
  <circle class="nd" cx="590" cy="92" r="3" fill="#39d353" style="animation-delay:1.73s"/>
  <circle class="nd" cx="560" cy="162" r="3" fill="#e23b3b" style="animation-delay:1.19s"/>
  <circle class="nd" cx="648" cy="52" r="3" fill="#39d353" style="animation-delay:2.93s"/>
  <circle class="nd" cx="686" cy="132" r="3" fill="#39d353" style="animation-delay:0.14s"/>
  <circle class="nd" cx="742" cy="82" r="3" fill="#39d353" style="animation-delay:2.58s"/>
  <circle class="nd" cx="800" cy="152" r="3" fill="#39d353" style="animation-delay:0.87s"/>
  <circle class="nd" cx="834" cy="60" r="3" fill="#e23b3b" style="animation-delay:0.43s"/>
  <circle class="nd" cx="872" cy="112" r="3" fill="#39d353" style="animation-delay:0.35s"/>
  <circle class="nd" cx="636" cy="176" r="3" fill="#39d353" style="animation-delay:0.93s"/>
  <circle class="nd" cx="760" cy="36" r="3" fill="#39d353" style="animation-delay:2.45s"/>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite" path="M468 124 L524 44"/></circle>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="2.1s" begin="0.1s" repeatCount="indefinite" path="M834 60 L872 112"/></circle>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M400 64 L524 44"/></circle>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M742 82 L800 152"/></circle>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="3.1s" begin="0.9s" repeatCount="indefinite" path="M742 82 L760 36"/></circle>
  <circle r="1.9" fill="#8affb0"><animateMotion dur="2.5s" begin="1.6s" repeatCount="indefinite" path="M590 92 L560 162"/></circle>
  <!-- scan sweep over graph -->
  <rect x="0" y="0" width="90" height="200" fill="url(#scan)">
    <animate attributeName="x" from="360" to="900" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- left accent + text -->
  <rect x="52" y="58" width="4" height="86" rx="2" fill="#39d353"/>
  <text class="kick" x="72" y="66" font-size="14" fill="#39d353">// AI &#183; ML &#183; SECURITY<tspan class="cur"> _</tspan></text>

  <!-- name: glow pulse behind, base, then animated shimmer sweep -->
  <text class="glow" x="70" y="116" font-size="52" font-family="'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#39d353" filter="url(#ng)">Abdessamed Britah</text>
  <text class="name" x="70" y="116" font-size="52" fill="#ffffff">Abdessamed Britah</text>
  <g mask="url(#nameMask)">
    <g transform="skewX(-18)">
      <rect y="68" width="150" height="60" fill="url(#shine)">
        <animate attributeName="x" from="-180" to="760" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text class="sub" x="72" y="146" font-size="18" fill="#9fb4a8">AI &amp; ML Engineer &#183; AI Security &amp; LLM Safety</text>
  <rect x="0" y="197" width="900" height="3" fill="url(#uline)"/>
</svg>